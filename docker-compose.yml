version: '3.8'

services:
  rby1_rviz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rby1_rviz_container
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=52
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - .:/app
      # [추가] 호스트의 build/install 폴더가 컨테이너를 덮어쓰지 못하게 격리
      - /app/build
      - /app/install
      - /app/log
      # GUI 권한용
      - /tmp/.X11-unix:/tmp/.X11-unix
